{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAG SYSTEM - Contact</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="contact-container">

        <!-- Header -->
        <header class="contact-header">

            <h1>RAG SYSTEM</h1>

            <p>
                Have a question or want to know more?
                Get in touch with us.
            </p>

        </header>


        <!-- Contact Section -->
        <section class="contact-section">

            <!-- Contact Information -->
            <div class="contact-info">

                <h2>Contact Us</h2>

                <p>
                    <strong>Name:</strong> Faraz
                </p>

                <p>
                    <strong>Email:</strong>
                    faraz@example.com
                </p>

                <p>
                    <strong>Phone:</strong>
                    +91 98765 43210
                </p>

                <p>
                    <strong>Location:</strong>
                    India
                </p>

            </div>


            <!-- Contact Form -->
            <div class="contact-form">

                <h2>Send a Message</h2>

                <form method="POST">

                    {% csrf_token %}

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required
                    >


                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message..."
                        required
                    ></textarea>


                    <div class="button-group">

                        <button type="submit" class="btn btn-primary">
                            Send Message
                        </button>

                        <button type="reset" class="btn btn-secondary">
                            Clear
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- Navigation Buttons -->
        <div class="navigation">

            <a href="/" class="btn btn-home">
                Home
            </a>

            <a href="/about/" class="btn btn-about">
                About
            </a>

            <a href="/contact/" class="btn btn-contact">
                Contact
            </a>

        </div>


        <!-- Footer -->
        <footer>

            <p>
                © 2026 RAG SYSTEM. All Rights Reserved.
            </p>

        </footer>

    </div>

</body>
</html>
